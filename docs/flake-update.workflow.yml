name: flake-update
# Install: move to .github/workflows/flake-update.yml (needs a token with the workflow scope to push).
# Base nix CLI tools can't update in place, so refresh flake.lock weekly and open a PR.
# This never touches the fleet branch: a person merges the PR and releases separately.
on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Required repo secret (a PAT with repo + workflow scope): PRs and pushes made with github.token
          # do not trigger the check workflow. There is no fallback to github.token.
          token: ${{ secrets.FLAKE_UPDATE_TOKEN }}
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - run: nix flake update
      - run: scripts/check-baseline.sh
      - name: Open PR
        env:
          GH_TOKEN: ${{ secrets.FLAKE_UPDATE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "FLAKE_UPDATE_TOKEN secret is required" >&2; exit 1; fi
          if git diff --quiet flake.lock; then echo "flake.lock already current"; exit 0; fi
          branch="auto/flake-update-$(date +%Y%m%d)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "flake.lock: weekly update"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "flake.lock: weekly update" \
            --body "Automated weekly nix flake update. check-baseline passed. Merging does not change any Mac; releasing to fleet is a separate step that needs Matthew's OK."

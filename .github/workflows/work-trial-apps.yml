name: Work Trial Applications

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: work-trial-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS Applications and CLIs
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - name: Evaluate the workstation and generate its Brewfile
        run: |
          test "$(uname -m)" = arm64
          nix eval --no-write-lock-file .#darwinConfigurations.aarch64-darwin.system.drvPath
          nix eval --no-write-lock-file --raw .#darwinConfigurations.aarch64-darwin.config.homebrew.brewfile > "$RUNNER_TEMP/Brewfile"
          for cask in chatgpt claude wispr-flow zoom; do
            grep -E "^cask \"$cask\"(,|$)" "$RUNNER_TEMP/Brewfile"
          done
          grep -E '^cask "(chatgpt|claude|wispr-flow|zoom)"(,|$)' "$RUNNER_TEMP/Brewfile" > "$RUNNER_TEMP/WorkTrialBrewfile"
      - name: Install and verify the work trial desktop apps
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew bundle install --file="$RUNNER_TEMP/WorkTrialBrewfile"
          brew bundle check --file="$RUNNER_TEMP/WorkTrialBrewfile"
          brew list --cask chatgpt claude wispr-flow zoom
          for app in 'ChatGPT' 'Claude' 'Wispr Flow' 'zoom.us'; do
            test -d "/Applications/$app.app"
          done
      - name: Build and run the configured terminal tools
        run: |
          nix build --no-write-lock-file .#darwinConfigurations.aarch64-darwin.config.home-manager.users.sable.programs.claude-code.package --out-link "$RUNNER_TEMP/claude-code"
          nix build --no-write-lock-file .#darwinConfigurations.aarch64-darwin.config.home-manager.users.sable.programs.codex.package --out-link "$RUNNER_TEMP/codex"
          "$RUNNER_TEMP/claude-code/bin/claude" --version
          "$RUNNER_TEMP/codex/bin/codex" --version
      - name: Build the complete Darwin workstation configuration
        run: nix build --no-write-lock-file --no-link .#darwinConfigurations.aarch64-darwin.system
      - name: Confirm the lockfile was preserved
        run: git diff --exit-code -- flake.lock

  linux:
    name: NixOS Package Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - name: Supply disposable machine settings for evaluation
        run: |
          cat > hardware.nix <<'EOF'
          { ... }: {
            fileSystems."/" = { device = "/dev/ci-root"; fsType = "ext4"; };
          }
          EOF
          cat > local.nix <<'EOF'
          { ... }: { system.stateVersion = "26.05"; }
          EOF
      - name: Evaluate both architectures and their app coverage
        run: |
          nix eval --no-write-lock-file path:.#nixosConfigurations.x86_64-linux.config.system.build.toplevel.drvPath
          # The existing shared Slack package prevents a full aarch64-linux
          # workstation evaluation. Inspect package selection there without
          # forcing unsupported, unrelated package outputs.
          for system in x86_64-linux aarch64-linux; do
            nix eval --no-write-lock-file --json "path:.#nixosConfigurations.$system.config.environment.systemPackages" --apply 'packages: map (p: p.pname or p.name) packages' > "$RUNNER_TEMP/$system-packages.json"
            test "$(nix eval --no-write-lock-file "path:.#nixosConfigurations.$system.config.home-manager.users.sable.programs.claude-code.enable")" = true
            test "$(nix eval --no-write-lock-file "path:.#nixosConfigurations.$system.config.home-manager.users.sable.programs.codex.enable")" = true
          done
          jq -e 'index("zoom") != null' "$RUNNER_TEMP/x86_64-linux-packages.json"
          jq -e 'index("zoom") == null' "$RUNNER_TEMP/aarch64-linux-packages.json"
      - name: Build the configured Linux Zoom package
        run: |
          nix build --no-write-lock-file --impure --no-link --expr 'let flake = builtins.getFlake (toString ./.); in builtins.head (builtins.filter (p: (p.pname or "") == "zoom") flake.nixosConfigurations.x86_64-linux.config.environment.systemPackages)'
      - name: Confirm the lockfile was preserved
        run: git diff --exit-code -- flake.lock
